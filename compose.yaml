services:
  test: &test
    profiles: [test]
    image: agent-control-test:local
    build:
      context: .
      target: test
    command: [npm, run, typecheck, --workspace, backend]
    network_mode: none
    cpus: 2
    mem_limit: 2g
    environment:
      TMPDIR: /app
    volumes:
      - ./backend/src:/app/backend/src:ro
      - ./frontend/src:/app/frontend/src:ro
  test-db:
    <<: *test
    profiles: [test-db]
    image: ${LOCAL_TEST_IMAGE:-agent-control-test:local}
    command: [npm, run, test, --workspace, backend]
    network_mode: service:test-postgres
    cpus: 1.5
    mem_limit: 1536m
    environment:
      TMPDIR: /app
      AGENT_CONTROL_ISOLATED_TESTS: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: agentcontrol_test_control
      PGUSER: agentcontrol_admin
      PGPASSWORD: isolated-fixture-admin-password-never-production-01
      APP_PGPASSWORD: isolated-fixture-password-never-production-01
      PGSSLMODE: disable
    depends_on:
      test-postgres:
        condition: service_healthy
  test-postgres:
    profiles: [test-db]
    image: postgres:17-bookworm
    network_mode: none
    cpus: 0.5
    mem_limit: 512m
    environment:
      POSTGRES_DB: agentcontrol_test_control
      POSTGRES_USER: agentcontrol_admin
      POSTGRES_PASSWORD: isolated-fixture-admin-password-never-production-01
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agentcontrol_admin -d agentcontrol_test_control"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: agentcontrol
      POSTGRES_USER: agentcontrol_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin
    secrets:
      - postgres-admin
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agentcontrol_admin -d agentcontrol"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: ${APP_IMAGE:-agent-control-app:local}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${APP_PORT:-3001}}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:${APP_PORT:-3001}/api/auth/callback}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TENANTS_JSON_FILE: /run/secrets/tenants.json
      SESSION_SECRET_FILE: /run/secrets/session
      OFFICIAL_USAGE_STALE_AFTER_DAYS: ${OFFICIAL_USAGE_STALE_AFTER_DAYS:-35}
      PGHOST: postgres
      PGDATABASE: agentcontrol
      PGUSER: agentcontrol_app
      PGPASSWORD_FILE: /run/secrets/postgres-app
      PGSSLMODE: disable
      MAINTENANCE_FILE: /run/control/maintenance
    secrets:
      - postgres-app
      - session
      - source: tenants
        target: tenants.json
    volumes:
      - ${LOCAL_STATE_DIR}/control:/run/control:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/api/ready').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 6s
      retries: 30
    stop_grace_period: 130s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  data:
secrets:
  postgres-admin:
    file: ${LOCAL_STATE_DIR}/secrets/postgres-admin
  postgres-app:
    file: ${LOCAL_STATE_DIR}/secrets/postgres-app
  session:
    file: ${LOCAL_STATE_DIR}/secrets/session
  tenants:
    file: ${LOCAL_STATE_DIR}/secrets/tenants.json