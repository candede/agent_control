[project]
name = "agent-control-mcp"
version = "0.1.0"
description = "Tenant-bound FastMCP transport for the canonical Agent Control API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastmcp==4.1.0",
  "httpx2==2.13.1",
  "pydantic==2.14.0",
  "cryptography==48.0.1",
  "py-key-value-aio[filetree]==0.4.6",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "azure-storage-blob==12.31.0",
  "azure-identity==1.26.0",
  "aiohttp==3.14.4",
]

[project.scripts]
agent-control-mcp = "agent_control_mcp.__main__:main"

[build-system]
requires = ["uv_build==0.12.17"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.0",
  "mypy==1.20.2",
  "joserfc==1.7.5",
]

[tool.uv]
index-url = "https://packagefeedproxy.microsoft.io/pypi/simple"

[tool.uv.build-backend]
module-name = "agent_control_mcp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=../.local/mcp-tests"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
